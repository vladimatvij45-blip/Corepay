<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Кабинет</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#15171c;--c:#1e2128;--c2:#262a33;--b:#2f343f;--t:#e6e8ec;--m:#8a909c;--g:#9be564;--p:#a855f7;--r:#ef4444;--o:#f97316}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px system-ui,sans-serif;padding-top:env(safe-area-inset-top)}
button,select,input{font:inherit;color:inherit}
.i{flex:none;display:block}
header{display:flex;align-items:center;gap:12px;padding:14px 16px;position:sticky;top:0;background:var(--bg);z-index:5}
header h1{margin:0;font-size:22px}header small{display:block;color:var(--m);font-size:11px}
.burger{background:none;border:0;color:var(--m);padding:4px;display:grid;place-items:center}.av{margin-left:auto;width:42px;height:42px;border-radius:50%;background:var(--c2);display:grid;place-items:center;border:2px solid var(--g);color:var(--g)}
main{padding:0 16px 40px;max-width:760px;margin:auto}h2{font-size:22px;margin:8px 0 14px;display:flex;align-items:center;gap:8px}h2 .sp{margin-left:auto;display:flex;gap:8px}
.card{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.k{color:var(--m);font-size:12px}.v{font-size:30px;font-weight:700}
.btn{border:1px solid var(--b);background:var(--c2);border-radius:10px;padding:8px 14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.g{background:var(--g);color:#10200a;border-color:var(--g);font-weight:600}.btn.p{background:var(--p);border-color:var(--p)}.btn.ic{padding:7px 10px;border-color:var(--g);color:var(--g);background:none}.btn.r{border-color:var(--r);color:var(--r);background:none}
.tabs{display:flex;gap:10px}.tabs .btn{flex:1;text-align:center}.tabs .on{background:var(--g);color:#10200a;border-color:var(--g);font-weight:600}
.tag{display:inline-block;border:1px solid var(--m);border-radius:99px;padding:1px 9px;font-size:12px;margin:2px 2px 2px 0}.tag.g{background:var(--g);color:#10200a;border-color:var(--g)}
.muted{color:var(--m)}.empty{text-align:center;color:var(--m);padding:30px 0}.empty .i{margin:0 auto 10px}
.sw{width:42px;height:24px;border-radius:99px;background:var(--b);position:relative;cursor:pointer;flex:none;border:0}.sw:after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s}.sw.on{background:var(--g)}.sw.on:after{left:21px}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between}
#side{position:fixed;inset:0 auto 0 0;width:270px;background:var(--c);border-right:1px solid var(--b);padding:calc(16px + env(safe-area-inset-top)) 14px 16px;transform:translateX(-100%);transition:.2s;z-index:20;overflow:auto}
#side.open{transform:none}#shade{position:fixed;inset:0;background:#0008;display:none;z-index:15}#shade.open{display:block}
#side a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:var(--t);text-decoration:none;margin:2px 0}#side a.on{background:var(--c2);border-left:3px solid var(--g)}
.rt{font-size:13px;margin-top:14px}.rt div{display:flex;justify-content:space-between;padding:2px 0}.rt b{color:var(--g)}
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:30;padding:16px}.modal.open{display:flex}
.modal>div{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:18px;width:100%;max-width:420px;max-height:90vh;overflow:auto}
label{display:block;margin:12px 0 4px;font-size:13px;color:var(--m)}input,select{width:100%;background:var(--bg);border:1px solid var(--b);border-radius:10px;padding:10px}
.ri{display:flex;gap:10px;align-items:center;margin:8px 0;color:var(--g)}.ri>div{color:var(--t)}
.err{color:var(--r);font-size:13px;word-break:break-word}
</style></head><body>
<header><button class="burger" id="burger" aria-label="Меню"></button><div><h1 id="brand">…</h1><small id="slogan"></small></div><div class="av" id="av"></div></header>
<div id="shade" onclick="side(0)"></div><nav id="side"></nav>
<main id="app"></main>
<div class="modal" id="modal" onclick="if(event.target==this)closeM()"><div id="mbody"></div></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// ---------- иконки (SVG, набор в стиле Lucide) ----------
const I={
dash:'<rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/>',
news:'<path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/><path d="M18 14h-8"/><path d="M15 18h-5"/><path d="M10 6h8v4h-8V6Z"/>',
bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
card:'<rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/>',
deal:'<circle cx="12" cy="12" r="10"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 18V6"/>',
send:'<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
scale:'<path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="M7 21h10"/><path d="M12 3v18"/><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/>',
wallet:'<path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/>',
zap:'<path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/>',
menu:'<line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="18" y2="18"/>',
user:'<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
refresh:'<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>',
play:'<polygon points="6 3 20 12 6 21 6 3"/>',
plus:'<path d="M5 12h14"/><path d="M12 5v14"/>',
check:'<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
archive:'<rect width="20" height="5" x="2" y="3" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/>',
more:'<circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/>',
x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
bank:'<line x1="3" x2="21" y1="22" y2="22"/><line x1="6" x2="6" y1="18" y2="11"/><line x1="10" x2="10" y1="18" y2="11"/><line x1="14" x2="14" y1="18" y2="11"/><line x1="18" x2="18" y1="18" y2="11"/><polygon points="12 2 20 7 4 7"/>',
trash:'<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/>',
undo:'<path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11"/>',
lock:'<rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
dl:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/>'};
const ic=(n,s=18)=>`<svg class="i" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;
$('#burger').innerHTML=ic('menu',26);$('#burger').onclick=()=>side(1);$('#av').innerHTML=ic('user',22);

let S={},R={},page='dash',arch=false;
const D={traffic:false,n:{deal:{on:1,s:0},dispute:{on:1,s:1},msg:{on:1,s:2}},reqs:[],seq:4700,payTab:'avail',devices:[],mode:'manual',adm:{deals:0,vol:0,disp:0,bal:0,hold:0},dl:[]};
const NAV=[['dash','dash','Панель управления'],['news','news','Новости'],['notif','bell','Уведомления'],['req','card','Реквизиты'],['deals','deal','Сделки'],['pay','send','Выплаты'],['disp','scale','Споры'],['fin','wallet','Финансы'],['auto','zap','Автоматика'],['adm','lock','Админ']];
const SOUNDS=[['Звонок',[880,660,880]],['Хрусталь',[1320,1760]],['Сигнал',[520,520,520]]];
const TG=window.Telegram&&Telegram.WebApp;if(TG){try{TG.ready();TG.expand();TG.setHeaderColor('#15171c');TG.setBackgroundColor('#15171c')}catch(e){}}
const Q=new URLSearchParams(location.search),BRAND=Q.get('b')||'CorePay',SLOGAN_RAW=Q.get('s')||'',SLOGAN=(!SLOGAN_RAW||SLOGAN_RAW==='Макет особистого кабінету'||SLOGAN_RAW==='Макет личного кабинета')?'Приём платежей и выплаты':SLOGAN_RAW;
// Хранилище: Telegram CloudStorage (синхронизируется между устройствами), запасной вариант — localStorage. Сервер не нужен.
const CS=TG&&TG.CloudStorage&&TG.isVersionAtLeast&&TG.isVersionAtLeast('6.9')?TG.CloudStorage:null,CH=3000;
const csGet=k=>new Promise((ok,no)=>CS.getItems(k,(e,v)=>e?no(e):ok(v)));
const csSet=(k,v)=>new Promise((ok,no)=>CS.setItem(k,v,(e,r)=>e?no(e):ok(r)));
const csDel=k=>new Promise((ok,no)=>CS.removeItems(k,(e,r)=>e?no(e):ok(r)));
let dirty=false,busy=false,oldN=0;
const save=()=>{dirty=true;if(!busy)flush()};
async function flush(){busy=true;while(dirty){dirty=false;const j=JSON.stringify(S);try{localStorage.setItem('cab',j)}catch(e){}
if(CS)try{const n=Math.ceil(j.length/CH);for(let i=0;i<n;i++)await csSet('s'+i,j.slice(i*CH,(i+1)*CH));await csSet('n',String(n));
if(oldN>n){const x=[];for(let i=n;i<oldN;i++)x.push('s'+i);await csDel(x)}oldN=n}catch(e){}}busy=false}
async function loadState(){if(CS)try{const n=+((await csGet(['n'])).n||0);if(n){const ks=[...Array(n).keys()].map(i=>'s'+i),v=await csGet(ks);oldN=n;return JSON.parse(ks.map(k=>v[k]||'').join(''))}}catch(e){}
try{return JSON.parse(localStorage.getItem('cab')||'{}')}catch(e){return{}}}
function beep(i){try{const a=new(window.AudioContext||webkitAudioContext)();SOUNDS[i][1].forEach((f,k)=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=f;o.connect(g);g.connect(a.destination);g.gain.value=.15;o.start(a.currentTime+k*.18);o.stop(a.currentTime+k*.18+.14)})}catch(e){}}
function side(o){$('#side').classList.toggle('open',!!o);$('#shade').classList.toggle('open',!!o)}
const fmt=v=>v==null?'—.—':(+v).toLocaleString('ru',{maximumFractionDigits:v<10?3:2});
function nav(){const on=S.traffic;$('#side').innerHTML=`<div class="row" style="margin-bottom:10px"><span>Трафик</span><span class="tag">${on?'Онлайн':'Офлайн'}</span><button class="sw ${on?'on':''}" onclick="S.traffic=!S.traffic;save();nav();render()"></button></div>`+
NAV.map(n=>`<a href="#${n[0]}" class="${page==n[0]?'on':''}" onclick="side(0)">${ic(n[1],20)}<span>${n[2]}</span></a>`).join('')+
`<div class="rt"><b style="color:var(--m)">Курс Tether TRC-20</b>${['UAH','RUB','KZT'].map(c=>`<div><span>${fmt(R[c])}</span><b>${c}</b></div>`).join('')}<button class="btn" style="width:100%;margin-top:10px" onclick="side(0);ratesM()">Показать все курсы</button></div>`}
function ratesM(){const rs=Object.entries(R);M(`<h2>Курс Tether TRC-20</h2>${rs.length?rs.map(([c,v])=>`<div class="row card" style="padding:10px"><b>${c}</b><span>${fmt(v)}</span></div>`).join(''):'<p class="muted">Курсы недоступны — проверьте интернет.</p>'}<p class="muted" style="font-size:12px">Источник: ${esc(RM.src||'—')} · обновлено ${RM.t?Math.round((Date.now()-RM.t)/1000):'—'} с назад</p><button class="btn" onclick="closeM()">Закрыть</button>`)}
let RM={};
const CUR=['UAH','RUB','KZT','PLN','USD','EUR','GEL','TRY'];
async function jget(u){const c=new AbortController(),t=setTimeout(()=>c.abort(),10000);try{const r=await fetch(u,{signal:c.signal});if(!r.ok)throw Error(r.status);return await r.json()}finally{clearTimeout(t)}}
const SRC=[
['CoinGecko',async()=>{const j=(await jget('https://api.coingecko.com/api/v3/simple/price?ids=tether&vs_currencies='+CUR.map(c=>c.toLowerCase()).join(','))).tether;const o={};CUR.forEach(c=>{if(j[c.toLowerCase()]!=null)o[c]=j[c.toLowerCase()]});return o}],
['ExchangeRate-API (USD≈USDT)',async()=>{const j=(await jget('https://open.er-api.com/v6/latest/USD')).rates;const o={};CUR.forEach(c=>{if(j[c]!=null)o[c]=j[c]});return o}]];
async function loadRates(){if(RM.t&&Date.now()-RM.t<60000&&Object.keys(R).length){nav();return}
for(const[name,fn]of SRC){try{const v=await fn();if(Object.keys(v).length){R=v;RM={t:Date.now(),src:name};nav();return}}catch(e){}}nav()}
const M=h=>{$('#mbody').innerHTML=h;$('#modal').classList.add('open')},closeM=()=>$('#modal').classList.remove('open');
const sw=(on,f)=>`<button class="sw ${on?'on':''}" onclick="${f}"></button>`;
const pages={
dash(){const a=S.reqs.filter(r=>r.on&&!r.arch).length;return`<h2>Панель управления</h2><div class="grid"><div class="card"><div class="k">Сделок сегодня</div><div class="v">${S.adm.deals}</div></div><div class="card"><div class="k">Объём за день</div><div class="v">${fmt(S.adm.vol)} <small class="k">UAH</small></div></div><div class="card"><div class="k">Активных реквизитов</div><div class="v" style="color:var(--g)">${a}</div></div><div class="card"><div class="k">Открытых споров</div><div class="v">${S.adm.disp}</div></div></div><div class="card empty">График активности появится здесь.</div>`},
news(){return`<h2>Новости <span class="sp"><button class="btn ic" aria-label="Обновить" onclick="loadRates();render()">${ic('refresh')}</button></span></h2><div class="card empty">Пока нет новостей.</div>`},
notif(){return`<h2>Уведомления</h2><p class="muted">Звуковые уведомления в панели работают только в этой веб-версии.</p>`+[['deal','Новая сделка'],['dispute','Новый спор'],['msg','Новое сообщение']].map(([k,t])=>`<div class="card"><div class="row"><b>${t}</b>${sw(S.n[k].on,`S.n.${k}.on=+!S.n.${k}.on;save();render()`)}</div><div class="row" style="margin-top:10px"><select onchange="S.n.${k}.s=+this.value;save();beep(+this.value)">${SOUNDS.map((s,i)=>`<option value="${i}" ${S.n[k].s==i?'selected':''}>${s[0]}</option>`).join('')}</select><button class="btn" aria-label="Воспроизвести" onclick="beep(S.n.${k}.s)">${ic('play',16)}</button></div></div>`).join('')},
req(){const L=S.reqs.filter(r=>!!r.arch==arch);return`<h2>Реквизиты</h2><div class="row" style="margin-bottom:12px"><div class="tabs" style="width:230px"><button class="btn ${!arch?'on':''}" onclick="arch=false;render()">${ic('check',16)}Активные</button><button class="btn ${arch?'on':''}" onclick="arch=true;render()">${ic('archive',16)}Архив</button></div><button class="btn p" aria-label="Добавить" onclick="reqM()">${ic('plus',20)}</button></div>`+
(L.length?L.map(r=>`<div class="card"><div class="row"><span class="muted">ID: ${r.id}</span><span class="muted">${r.cur}</span>${sw(r.on,`tog(${r.id})`)}<button class="btn" aria-label="Действия" onclick="act(${r.id})">${ic('more',18)}</button></div><div class="ri">${ic('bank',26)}<div><b>${esc(r.num.replace(/(.{4})/g,'$1 ').trim())}</b><br><span class="muted">${esc(r.holder)}</span></div></div><span class="tag">${{card:'Карта',ecom:'E-COM',iban:'IBAN '+r.cur}[r.type]}</span><span class="tag">${esc(r.sched||'Без расписания')}</span>${r.int?`<span class="tag">каждые ${esc(r.int)} мин</span>`:''}<div class="muted" style="font-size:13px;margin-top:6px"><b style="color:var(--g)">0</b> из 5 активных</div></div>`).join(''):`<div class="card empty">${arch?'Архив пуст.':'Список пуст. Нажмите «+», чтобы создать первый реквизит.'}</div>`)},
deals(){return`<h2>Сделки</h2>`+(S.dl.length?S.dl.map(d=>`<div class="card"><div class="row"><b>#${d.id}</b><span class="tag g">Завершена</span><span class="muted">${d.t}</span></div><div class="row" style="margin-top:8px"><span>${fmt(d.a)} UAH</span><span class="muted">${fmt(d.u)} USDT</span></div></div>`).join(''):'<div class="card empty">Сделок пока нет.</div>')},
pay(){const t=S.payTab;return`<h2>Выплаты <span class="sp"><button class="btn g" onclick="alert('Пока нет данных для выгрузки')">${ic('dl',16)}Выгрузить</button></span></h2><div class="grid"><div class="card"><div class="k">Активных выплат</div><div class="v" style="color:var(--g)">0</div><div class="k">из 5</div></div><div class="card"><div class="k">Холд для вас</div><div class="v" style="color:var(--o)">30</div><div class="k">мин ожидания</div></div></div><div class="tabs" style="margin:10px 0"><button class="btn ${t=='avail'?'on':''}" onclick="S.payTab='avail';save();render()">Доступные выплаты</button><button class="btn ${t=='hist'?'on':''}" onclick="S.payTab='hist';save();render()">История выплат</button></div><div class="card empty">${t=='avail'?'Пока нет заявок.<br><br><button class="btn r" onclick="render()">'+ic('refresh',16)+'Обновить</button>':'История пуста.'}</div>`},
disp(){return`<h2>Споры по сделкам</h2><div class="card empty">Споров нет.</div>`},
fin(){const u=R.UAH;return`<h2>Финансы</h2><div class="grid"><div class="card"><div class="k">Баланс</div><div class="v">${S.adm.bal.toFixed(2)}</div><div class="k">USDT ≈ ${fmt(S.adm.bal*u||0)} UAH</div></div><div class="card"><div class="k">В холде</div><div class="v">${S.adm.hold.toFixed(2)}</div><div class="k">USDT</div></div></div><div class="card empty">Операций нет.</div>`},
adm(){const a=S.adm,f=(k,t)=>`<label>${t}</label><input id="a_${k}" inputmode="decimal" value="${a[k]}">`;
return`<h2>Админ</h2><div class="card"><b>Показатели</b>${f('deals','Сделок сегодня')}${f('vol','Объём за день, UAH')}${f('disp','Открытых споров')}${f('bal','Баланс, USDT')}${f('hold','В холде, USDT')}<button class="btn g" style="margin-top:12px;width:100%" onclick="admSave()">Применить</button></div>
<div class="card"><b>Накрутить сделки</b><label>Количество</label><input id="g_n" inputmode="numeric" value="10"><label>Сумма от, UAH</label><input id="g_a" inputmode="numeric" value="500"><label>Сумма до, UAH</label><input id="g_b" inputmode="numeric" value="5000"><label>Комиссия на баланс, %</label><input id="g_c" inputmode="decimal" value="1.5"><button class="btn p" style="margin-top:12px;width:100%" onclick="admGen()">${ic('plus',16)}Добавить сделки</button></div>
<div class="card"><button class="btn r" style="width:100%" onclick="if(confirm('Обнулить все показатели и сделки?')){S.adm={deals:0,vol:0,disp:0,bal:0,hold:0};S.dl=[];save();render()}">${ic('trash',16)}Сбросить всё</button></div>`},
auto(){return`<h2>Устройства</h2><div class="card"><b>Создать токен для устройства</b><label>Название устройства</label><input id="dn" placeholder="Напр.: Samsung Galaxy S21"><button class="btn g" style="margin-top:12px" onclick="addDev()">Создать токен</button></div>`+S.devices.map((d,i)=>`<div class="card"><div class="row"><b>${esc(d.name)}</b><button class="btn r" aria-label="Удалить" onclick="S.devices.splice(${i},1);save();render()">${ic('x',16)}</button></div><code style="word-break:break-all;color:var(--g)">${d.token}</code></div>`).join('')+`<div class="card"><b>Режим обработки СМС</b><select style="margin-top:8px" onchange="S.mode=this.value;save()"><option value="manual" ${S.mode=='manual'?'selected':''}>Ручной — СМС привязывается вручную</option><option value="auto" ${S.mode=='auto'?'selected':''}>Автоматический</option></select></div>`}};
function admSave(){const a=S.adm;for(const k of Object.keys(a))a[k]=Math.max(0,+String($('#a_'+k).value).replace(',','.')||0);save();render()}
function admGen(){const n=Math.min(500,Math.max(1,+$('#g_n').value|0)),lo=+$('#g_a').value||0,hi=Math.max(lo,+$('#g_b').value||0),c=(+String($('#g_c').value).replace(',','.')||0)/100,u=R.UAH||41,now=new Date();let sum=0;
for(let i=0;i<n;i++){const a=Math.round(lo+Math.random()*(hi-lo)),d=new Date(now-Math.random()*(now.getHours()*60+now.getMinutes()+1)*60000);sum+=a;
S.dl.unshift({id:++S.seq,a,u:a/u,t:String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')})}
S.dl.sort((x,y)=>y.id-x.id);S.dl=S.dl.slice(0,150);S.adm.deals+=n;S.adm.vol+=sum;S.adm.bal+=sum/u*c;save();location.hash='#deals';render()}
function addDev(){const n=$('#dn').value.trim();if(!n)return;S.devices.push({name:n,token:[...crypto.getRandomValues(new Uint8Array(16))].map(b=>b.toString(16).padStart(2,'0')).join('')});save();render()}
function tog(id){const r=S.reqs.find(r=>r.id==id);r.on=!r.on;save();render()}
function act(id){const r=S.reqs.find(r=>r.id==id);M(`<h2>ID ${id}</h2><button class="btn" style="width:100%;margin:4px 0" onclick="S.reqs.find(r=>r.id==${id}).arch=${!r.arch};save();closeM();render()">${r.arch?ic('undo',16)+'Восстановить':ic('archive',16)+'В архив'}</button><button class="btn r" style="width:100%;margin:4px 0" onclick="if(confirm('Удалить?')){S.reqs=S.reqs.filter(r=>r.id!=${id});save();closeM();render()}">${ic('trash',16)}Удалить</button>`)}
function reqM(){M(`<h2>Новый реквизит</h2><label>Валюта</label><select id="rc"><option>UAH</option><option>RUB</option><option>KZT</option><option>PLN</option></select><label>Тип</label><select id="rt"><option value="">Выберите тип реквизита</option><option value="card">Карта</option><option value="ecom">E-COM</option><option value="iban">IBAN</option></select><label>Номер карты / IBAN</label><input id="rn" inputmode="numeric" placeholder="4441 1144 …"><label>Владелец</label><input id="rh"><label>Интервал (мин)</label><input id="ri" inputmode="numeric" placeholder="Пусто — без ограничений"><label>Расписание</label><select id="rs"><option value="">Без расписания</option></select><div class="row" style="margin-top:12px"><span>Реквизит включён</span><button class="sw on" id="ro" onclick="this.classList.toggle('on')"></button></div><div class="row" style="margin-top:18px;justify-content:flex-end"><button class="btn" onclick="closeM()">Отмена</button><button class="btn g" onclick="saveReq()">Сохранить</button></div>`)}
function saveReq(){const type=$('#rt').value,num=$('#rn').value.replace(/\s/g,''),holder=$('#rh').value.trim();if(!type||num.length<8||!holder)return alert('Выберите тип, укажите номер (мин. 8 символов) и владельца');S.reqs.unshift({id:++S.seq,cur:$('#rc').value,type,num,holder,int:$('#ri').value,sched:$('#rs').value,on:$('#ro').classList.contains('on'),arch:false});save();closeM();arch=false;render()}
function render(){page=(location.hash.slice(1)||'dash');if(!pages[page])page='dash';$('#app').innerHTML=pages[page]();nav()}
addEventListener('hashchange',render);
const fail=m=>{$('#app').innerHTML=`<div class="card empty">${ic('lock',34)}${m}</div>`};
addEventListener('error',e=>{if(!S.reqs)fail('Ошибка запуска.<br><span class="err">'+esc(e.message)+'</span>')});
(async()=>{
if(!TG||!TG.initData){fail('Откройте кабинет через бота (кнопка «Кабинет»).');return}
try{const st=await loadState();S=Object.assign(JSON.parse(JSON.stringify(D)),st);$('#brand').textContent=BRAND;$('#slogan').textContent=SLOGAN;document.title=BRAND;render();loadRates();setInterval(loadRates,60000)}
catch(e){fail('Ошибка запуска.<br><span class="err">'+esc(e&&e.message||e)+'</span>')}})();
</script></body></html>
